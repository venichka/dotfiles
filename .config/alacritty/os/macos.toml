# macOS settings, imported by alacritty.toml through the os.toml symlink (see PLATFORMS.md).

[window]
decorations = "buttonless"
opacity = 1.0

# Monaspace Neon (Linux uses Iosevka Term). It has true italics but lacks some of the
# sub/superscripts vimtex conceals to: Greek ones like ᵦ ᵧ ᵝ ᵞ, and ˂ ˃. Iosevka Term covers
# them; it's kept installed as the alternative: "IosevkaTerm Nerd Font Mono".
[font.normal]
family = "MonaspiceNe Nerd Font Mono"
style = "Regular"

[font.bold]
family = "MonaspiceNe Nerd Font Mono"
style = "Bold"

[font.italic]
family = "MonaspiceNe Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "MonaspiceNe Nerd Font Mono"
style = "Bold Italic"
